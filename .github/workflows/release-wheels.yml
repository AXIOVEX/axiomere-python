name: Release wheels

# Multi-platform wheel matrix for the Axiomere Python distributions.
#
# Two distributions exist by design:
#   * `axiomere`     — this repo: the pure-Python wrapper (hatchling,
#                      py3-none-any wheel + sdist). Already publishable.
#   * `axiomere-py`  — AXIOVEX/axiomere, crates/axiomere-py: the native
#                      PyO3 extension `_axiomere` (maturin). The wrapper
#                      imports it and refuses to import without it, so
#                      most users need a prebuilt extension wheel for
#                      their platform instead of a local Rust toolchain.
#
# A locally built extension wheel is tagged `linux_x86_64`, which PyPI
# rejects. This workflow builds the extension with cibuildwheel across
# the platform/Python matrix so future releases can ship proper
# manylinux / macOS / Windows wheels.
#
# Status: first practice run 2026-10-13 (workflow_dispatch). It found
# two faults: the 32-bit Linux build container does not ship libatomic,
# which the rustup installer needs (the x86_64 wheels all built), and
# the macos-13 runner image has been retired by GitHub, so that leg
# waited forever. Both are fixed in this version. The publish job is
# dispatch/tag gated and expects PyPI Trusted Publishing (OIDC) to be
# configured for both projects; no API tokens are stored in this repo.
#
# WS-7 hardening (2026-10-13, red-team findings RTE-11/RTE-12/RTE-14):
# the core checkout below is pinned to one exact commit instead of
# floating on core main; every action in this repo's workflows is
# pinned by commit SHA (the version each SHA was resolved from is
# kept as a trailing comment); and the wheel smoke test runs a full
# signed round trip instead of an import-only check.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-extension-wheels:
    name: Extension wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-15-intel, macos-14]
    steps:
      - name: Check out the Rust core (bindings source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AXIOVEX/axiomere
          path: axiomere-core
          # Pinned to the exact core commit this release line is built
          # against: Axiomere Spec 003 (verification policy), core main
          # as of 2026-10-13. Bump this deliberately, in the same change
          # that re-tests the wrapper against the new core — never let
          # it float on core main (RTE-11).
          ref: cc452998c7bdbdd3fae50964733fef5f9bed0d3e

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # cibuildwheel builds Linux wheels inside manylinux containers,
      # where the runner's Rust toolchain is not visible — install
      # rustup inside the container via before-all (see env below).
      # macOS/Windows build on the runner itself:
      - name: Install Rust (macOS/Windows runners)
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Named explicitly because the action is SHA-pinned: pinned
          # by commit, the toolchain can no longer be read off the ref.
          toolchain: stable

      - name: Build extension wheels with cibuildwheel
        uses: pypa/cibuildwheel@7940a4c0e76eb2030e473a5f864f291f63ee879b # v2.21
        with:
          package-dir: axiomere-core/crates/axiomere-py
          output-dir: wheelhouse
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* pp*"
          CIBW_BEFORE_ALL_LINUX: >-
            yum install -y libatomic && curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs
            | sh -s -- -y --default-toolchain stable --profile minimal
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # The Rust extension's minimum macOS target is 10.12; without
          # this, the x86_64 wheel targets 10.9 and delocate refuses the
          # mismatch (proving run 38460717489).
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=10.12'
          # Smoke-test each built wheel with a real signed round trip
          # before the wheel is kept: create a ledger under a fresh
          # key, append an event, take a snapshot, checkpoint, then
          # verify in trusted mode (every signature checked against
          # the key map) and verify the written file standalone. An
          # extension that merely imports is not enough (RTE-12).
          CIBW_TEST_COMMAND: >-
            python -c "import _axiomere, os, tempfile; seed, pub = _axiomere.generate_keypair(); p = os.path.join(tempfile.mkdtemp(), 'smoke.axmr'); db = _axiomere.create_with_seed(p, seed); db.append('smoke.event', {'n': 1}, 'smoke'); db.snapshot('smoke-rec', {'v': 1}, 'smoke'); db.checkpoint('smoke'); v = db.verify(trusted={'smoke': pub}); assert v['ok'] and v['signatures_checked'] == v['events'], v; f = _axiomere.verify_file(p, trusted={'smoke': pub}); assert f['ok'], f; print('signed round trip ok:', v['events'], 'events,', v['signatures_checked'], 'signatures checked')"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-wrapper:
    name: Wrapper sdist + wheel (this repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          pip install build
          python -m build --outdir dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrapper-dist
          path: dist/*

  publish:
    name: Publish to PyPI (tags only)
    needs: [build-extension-wheels, build-wrapper]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # Trusted Publishing: configure an OIDC publisher for the
    # `axiomere` and `axiomere-py` projects on PyPI pointing at this
    # workflow, then grant this job `id-token: write`. Until that is
    # configured this job will fail at the publish step by design.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: all-dist
          merge-multiple: true
      - name: Split artifacts by project
        run: |
          mkdir -p pub-wrapper pub-extension
          # Wrapper: axiomere-* ; extension wheels: axiomere_py-*
          mv all-dist/axiomere-*.tar.gz all-dist/axiomere-*.whl pub-wrapper/ 2>/dev/null || true
          mv all-dist/axiomere_py-*.whl pub-extension/ 2>/dev/null || true
          ls -la pub-wrapper pub-extension
      - name: Publish wrapper (axiomere)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pub-wrapper
      - name: Publish extension wheels (axiomere-py)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: pub-extension
