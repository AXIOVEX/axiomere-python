name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out the Rust core (bindings source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: AXIOVEX/axiomere
          path: axiomere-core
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          # Named explicitly because the action is SHA-pinned: pinned
          # by commit, the toolchain can no longer be read off the ref.
          toolchain: stable
      - name: Build bindings + install package + test deps
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest
          maturin build -m axiomere-core/crates/axiomere-py/Cargo.toml
          pip install axiomere-core/target/wheels/*.whl
          pip install .
      - name: Run tests
        run: .venv/bin/python -m pytest -q
