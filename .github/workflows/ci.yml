name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the Rust core (bindings source)
        uses: actions/checkout@v4
        with:
          repository: AXIOVEX/axiomere
          path: axiomere-core
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build bindings + install package + test deps
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest
          (cd axiomere-core && "$OLDPWD/.venv/bin/maturin" build -m crates/axiomere-py/Cargo.toml)
          .venv/bin/pip install axiomere-core/target/wheels/*.whl
          .venv/bin/pip install .
      - name: Run tests
        run: .venv/bin/python -m pytest -q
